name: ci
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check, contract, recipes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Self-test and copy lint
        run: npm run check
      - name: contract.json matches the CLIs
        run: npm run contract
      - name: Shipped recipes
        run: |
          for f in examples/recipes/*.Reel.md; do
            echo "== $f"
            node kit/reelmd.cjs check "$f" > out.txt || { cat out.txt; exit 1; }
            tail -1 out.txt
          done

  smoke:
    name: smoke (CPU, synthetic clips, tiny Whisper)
    runs-on: ubuntu-latest
    # about 2 minutes of setup and 9 to 12 of smoke; the steps below carry their own limits, so one stuck step fails
    # fast and names itself instead of eating the whole job
    timeout-minutes: 30
    env:
      PYTHON: python
      HF_HUB_DISABLE_TELEMETRY: '1'
      FFMPEG_BUILD: ffmpeg-n8.1-latest-linux64-gpl-8.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt
      # a static ffmpeg build from GitHub, cached, instead of apt: apt-get update on a slow mirror once took 10.5 minutes
      # and ran the job out of time. apt stays as the fallback if the download fails.
      - name: ffmpeg cache
        uses: actions/cache@v4
        with:
          path: ~/ffmpeg
          key: ${{ env.FFMPEG_BUILD }}-v1
      - name: ffmpeg
        timeout-minutes: 6
        run: |
          if [ ! -x ~/ffmpeg/bin/ffmpeg ]; then
            mkdir -p ~/ffmpeg
            if curl -fsSL --retry 3 --max-time 120 -o /tmp/ff.tar.xz "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/$FFMPEG_BUILD.tar.xz" \
              && tar -xJf /tmp/ff.tar.xz -C ~/ffmpeg --strip-components=1 "$FFMPEG_BUILD/bin/ffmpeg" "$FFMPEG_BUILD/bin/ffprobe"; then
              echo "static $FFMPEG_BUILD"
            else
              rm -rf ~/ffmpeg; echo "download failed, using apt"
              sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
            fi
          fi
          [ -x ~/ffmpeg/bin/ffmpeg ] && echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/ffmpeg/bin:$PATH"; ffmpeg -hide_banner -version | head -1
      - run: npm ci
        timeout-minutes: 5
      - run: python -m pip install -r requirements.txt
        timeout-minutes: 8
      - name: Chrome
        timeout-minutes: 5
        run: npm run chrome
      - name: Whisper model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-tiny-en-v1
      - name: Smoke test (synthetic clips end to end, with the tiny Whisper model)
        timeout-minutes: 20
        run: npm run smoke:whisper
